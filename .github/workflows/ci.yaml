name: Build and Test

on:
  pull_request:
  # Called by the Docker publish workflow, which will not push an image unless this
  # passes. Pushes to main are covered that way rather than by a trigger here, so that
  # the tests run exactly once per commit.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit, layer and schema-conformance tests. The integration and differential
      # suites are excluded by default; see USAGE.md for running them.
      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests

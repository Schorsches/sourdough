name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit, layer and schema-conformance tests. The integration and differential
      # suites are excluded by default; see USAGE.md for running them.
      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests

name: Build Docker Image, Push to GHCR

on:
  push:
    # Publish HEAD of main branch as :main image tag
    branches: [ "main" ]
    # Publish semver tags as named image tags
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jake-low/sourdough-builder

jobs:
  # Gate: no image is published unless the test suite passes on this commit.
  test:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable BuildKit for docker builds. This enables building
      # multi-platform images and exporting the layer cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only the upstream repository publishes. A fork's GITHUB_TOKEN has package write
      # access in its own namespace only, so pushing to IMAGE_NAME from a fork fails with
      # "permission_denied: The requested installation does not exist" after a full build.
      # https://github.com/docker/login-action
      - name: Login to Registry ${{ env.REGISTRY }}
        if: ${{ !github.event.repository.fork }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Forks still build the image, which is what checks the Dockerfile, but stop
          # short of publishing it.
          push: ${{ !github.event.repository.fork }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
